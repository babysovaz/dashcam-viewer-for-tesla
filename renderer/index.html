<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' tcam:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src tcam: data:; media-src tcam:; connect-src tcam:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashcam Viewer for Tesla</title>
<style>
  :root { --bg:#0e0f11; --panel:#16181c; --line:#26292f; --txt:#e8e9eb; --dim:#8b9099; --acc:#e82127; --sel:#1f2329; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.4 "Segoe UI",system-ui,sans-serif; }
  body { display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.5px; }
  header h1 b { color:var(--acc); }
  button, select { background:#22252b; color:var(--txt); border:1px solid #33373e; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover, select:hover { background:#2b2f36; }
  button.primary { background:var(--acc); border-color:var(--acc); font-weight:600; }
  #status { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:300px 1fr; min-height:0; }
  aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
  .filters { position:sticky; top:0; display:flex; gap:4px; padding:8px; background:var(--panel); border-bottom:1px solid var(--line); z-index:1; }
  .filters button { flex:1; padding:4px 6px; font-size:12px; }
  .filters button.on { background:var(--sel); border-color:var(--acc); }
  .day { padding:10px 12px 4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .ev { display:grid; grid-template-columns:72px 1fr; gap:10px; padding:8px 12px; cursor:pointer; border-left:3px solid transparent; }
  .ev:hover { background:#1b1e23; }
  .ev.active { background:var(--sel); border-left-color:var(--acc); }
  .ev img, .ev .noimg { width:72px; height:46px; object-fit:cover; border-radius:4px; background:#24272d; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .ev .t { font-weight:600; }
  .ev .s { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev.locked { opacity:.55; }
  .tag { font-size:10px; padding:1px 5px; border-radius:3px; background:#2a2e35; color:var(--dim); margin-left:4px; }
  #player { display:grid; grid-template-rows:1fr auto; min-height:0; min-width:0; }
  #empty { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--dim); text-align:center; padding:40px; }
  #empty .big { font-size:42px; }
  #stage { display:grid; gap:4px; padding:4px; min-height:0; background:#000; position:relative; }
  #stage.grid { grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); grid-template-areas:"lp f rp" "lr b rr"; }
  #stage.fb   { grid-template-columns:repeat(4,1fr); grid-template-rows:1fr 26%; grid-template-areas:"f f b b" "lp lr rr rp"; }
  #stage:not(.focus) [data-cam=front]{grid-area:f} #stage:not(.focus) [data-cam=back]{grid-area:b}
  #stage:not(.focus) [data-cam=left_pillar]{grid-area:lp} #stage:not(.focus) [data-cam=right_pillar]{grid-area:rp}
  #stage:not(.focus) [data-cam=left_repeater]{grid-area:lr} #stage:not(.focus) [data-cam=right_repeater]{grid-area:rr}
  #hud { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none; display:flex; align-items:center; gap:14px;
         background:rgba(10,11,13,.72); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:8px 16px; }
  #hudBtn.on { border-color:var(--acc); }
  #hud .gear span { font-weight:700; color:#555; margin:0 2px; font-size:14px; } #hud .gear span.on { color:#fff; }
  #hud .spd { text-align:center; line-height:1; } #hud .spd b { font-size:30px; font-variant-numeric:tabular-nums; display:block; } #hud .spd small { color:var(--dim); font-size:10px; }
  #hWheel { width:30px; height:30px; color:#ddd; transition:transform .08s linear; } #hSteer { color:var(--dim); font-size:11px; min-width:34px; font-variant-numeric:tabular-nums; }
  #hud .ped { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9px; color:var(--dim); }
  #hud .bar { width:10px; height:30px; background:#2a2d33; border-radius:3px; position:relative; overflow:hidden; } #hud .bar i { position:absolute; bottom:0; left:0; right:0; background:#3fb950; }
  #hud .pill { font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; background:#2a2d33; color:#555; }
  #hBrake.on { background:#c62828; color:#fff; } #hAp.on { background:#1565c0; color:#fff; }
  #hud .gf { text-align:center; line-height:1; min-width:38px; } #hud .gf b { font-size:16px; font-variant-numeric:tabular-nums; display:block; } #hud .gf small { color:var(--dim); font-size:9px; }
  #hud .gf.hi b { color:#ffcc00; }
  #hud .blink { font-size:18px; color:#333; } #hud .blink.on { color:#3fb950; animation:blk .7s steps(1) infinite; }
  @keyframes blk { 50% { opacity:.15; } }
  #hudNone { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; pointer-events:none; font-size:11px; color:var(--dim); background:rgba(10,11,13,.7); padding:4px 10px; border-radius:8px; }
  .ev .noimg.unl { font-size:20px; }
  #stage.focus { grid-template-columns:repeat(5,1fr); grid-template-rows:1fr 18%; }
  #stage.focus .cam.main { grid-column:1 / -1; grid-row:1; }
  #stage.focus .cam:not(.main) { grid-row:2; }
  .cam { position:relative; min-height:0; min-width:0; background:#000; cursor:pointer; overflow:hidden; border-radius:3px; outline:2px solid transparent; }
  .cam.main { outline-color:var(--acc); }
  .cam video { width:100%; height:100%; object-fit:contain; display:block; }
  .cam .lbl { position:absolute; left:6px; top:4px; font-size:11px; padding:1px 6px; background:rgba(0,0,0,.6); border-radius:3px; pointer-events:none; }
  .cam .lbl kbd { color:var(--dim); font:inherit; margin-left:4px; }
  .cam.missing::after { content:attr(data-missing); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; }
  #bar { padding:8px 14px 10px; border-top:1px solid var(--line); background:var(--panel); }
  #tl { position:relative; height:24px; margin-top:12px; }
  #tl input { width:100%; margin:0; position:absolute; top:4px; accent-color:var(--acc); }
  #mark { position:absolute; top:2px; width:3px; height:20px; background:#ffcc00; border-radius:2px; display:none; z-index:2; pointer-events:none; }
  #mark .flag { position:absolute; top:-16px; left:-3px; color:#ffcc00; font-size:14px; pointer-events:auto; cursor:pointer; }
  #moments { position:absolute; left:0; right:0; top:-11px; height:12px; pointer-events:none; }
  #moments .mo { position:absolute; top:0; transform:translateX(-50%); font-size:11px; line-height:12px; cursor:pointer; pointer-events:auto; filter:drop-shadow(0 0 2px #000); }
  #moments .mo:hover { transform:translateX(-50%) scale(1.4); }
  #row { display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  #clock { font-variant-numeric:tabular-nums; font-size:15px; font-weight:600; min-width:80px; }
  #rel { color:var(--dim); font-variant-numeric:tabular-nums; }
  #info { margin-left:auto; color:var(--dim); font-size:12px; text-align:right; }
  #help { color:var(--dim); font-size:11px; margin-top:6px; }
  #help kbd { background:#24272d; border:1px solid #33373e; border-radius:3px; padding:0 4px; font:11px/1.5 Consolas,monospace; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid #3a3f47; border-radius:10px; padding:18px 20px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  #auth.on { border-color:#2e7d32; }
  #toast.link { cursor:pointer; }
  #expDlg label { display:block; margin:6px 0; }
  #expDlg { max-width:560px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 10px; }
  .modes button { text-align:left; padding:10px 12px; border-radius:10px; border:2px solid #33373e; background:#1c1f24; }
  .modes button b { display:block; font-size:15px; margin-bottom:3px; } .modes button small { color:var(--dim); font-size:12px; line-height:1.35; display:block; }
  .modes button.on { border-color:var(--acc); background:#241b1c; }
  #expModeNote { font-size:12px; color:#e0c36a; background:#2a2617; border:1px solid #4a4125; border-radius:6px; padding:6px 9px; margin:6px 0; }
  #expCustom summary { cursor:pointer; color:var(--dim); font-size:12px; margin-top:8px; }
  #expCustom { border-top:1px solid var(--line); margin-top:8px; padding-top:4px; }
  #expDlg progress { width:100%; height:14px; accent-color:var(--acc); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2b2f36; padding:10px 16px; border-radius:8px; border:1px solid #3a3f47; display:none; max-width:560px; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>🎥 Dashcam Viewer <small style="font-weight:400;color:var(--dim)">for Tesla</small></h1>
  <button class="primary" id="pick" data-i18n="open_folder"></button>
  <span id="status" data-i18n="status_hint"></span>
  <select id="langSel" data-i18n-title="lang_t" style="margin-left:auto"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option></select>
  <button id="auth"></button>
</header>
<main>
  <aside>
    <div class="filters">
      <button data-f="all" class="on" data-i18n="f_all"></button>
      <button data-f="SavedClips" data-i18n="f_saved"></button>
      <button data-f="SentryClips" data-i18n="f_sentry"></button>
      <button data-f="RecentClips" data-i18n="f_recent"></button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="player">
    <div id="empty"><div class="big">🎥</div><div data-i18n="empty"></div></div>
    <div id="stage" class="grid" hidden></div>
    <div id="bar" hidden>
      <div id="tl"><input type="range" id="seek" min="0" max="60" step="0.05" value="0"><div id="moments"></div><div id="mark"><span class="flag" data-i18n-title="flag_title">⚑</span></div></div>
      <div id="row">
        <button id="prevEv" data-i18n-title="prev_ev">⏮</button>
        <button id="play" data-i18n-title="play_t">▶</button>
        <button id="nextEv" data-i18n-title="next_ev">⏭</button>
        <span id="clock">--:--:--</span><span id="rel">0:00 / 0:00</span>
        <select id="rate" data-i18n-title="rate_t"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
        <select id="layoutSel" data-i18n-title="layout_t">
          <option value="grid" data-i18n="lay_grid"></option><option value="fb" data-i18n="lay_fb"></option>
          <option value="focus" data-i18n="lay_focus"></option></select>
        <button id="hudBtn" data-i18n-title="hud_t" data-i18n="hud_btn"></button>
        <button id="toEvent" data-i18n-title="toevent_t" data-i18n="toevent"></button>
        <button id="sumBtn" data-i18n="sum_btn" data-i18n-title="sum_btn_t"></button>
        <button id="exportBtn"></button>
        <span id="info"></span>
      </div>
      <div id="help" data-i18n="help"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<dialog id="authDlg">
  <h3 style="margin-top:0" data-i18n="acct_title"></h3>
  <p id="authState" style="color:var(--dim)"></p>
  <p style="color:var(--dim);font-size:12px;max-width:460px" data-i18n="acct_info"></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="dlgConnect" class="primary" data-i18n="connect"></button>
    <button id="dlgSignout" data-i18n="signout"></button>
    <button id="dlgForget" data-i18n="forget"></button>
    <button id="dlgClose" style="margin-left:auto" data-i18n="close"></button>
  </div>
  <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--dim);font-size:12px" data-i18n="manual_sum"></summary>
    <p style="color:var(--dim);font-size:12px" data-i18n="manual_help"></p>
    <input id="dlgToken" type="password" placeholder="Bearer eyJ…" style="width:100%;padding:6px;background:#111;color:#eee;border:1px solid #333;border-radius:4px">
    <button id="dlgTokenOk" style="margin-top:6px" data-i18n="use_token"></button>
  </details>
</dialog>
<dialog id="sumDlg" style="width:620px">
  <h3 style="margin-top:0" data-i18n="sum_title"></h3>
  <p style="color:var(--dim);font-size:12px" data-i18n="sum_help"></p>
  <label style="display:block;margin:4px 0"><input type="checkbox" id="sumPlace" checked> <span data-i18n="sum_place_opt"></span></label>
  <label style="display:block;margin:4px 0"><input type="checkbox" id="sumSpeed" checked> <span data-i18n="sum_speed_opt"></span></label>
  <textarea id="sumText" readonly style="width:100%;height:210px;margin-top:8px;background:#111;color:#eee;border:1px solid #333;border-radius:6px;padding:8px;font:13px/1.45 'Segoe UI',sans-serif;resize:vertical"></textarea>
  <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
    <button id="sumClose" data-i18n="close"></button>
    <button id="sumCopy" class="primary" data-i18n="sum_copy"></button>
  </div>
</dialog>
<dialog id="expDlg">
  <h3 style="margin-top:0" id="expTitle"></h3>
  <div id="expForm">
    <div class="modes">
      <button type="button" data-mode="insurance"><b data-i18n="mode_ins"></b><small data-i18n="mode_ins_d"></small></button>
      <button type="button" data-mode="social"><b data-i18n="mode_soc"></b><small data-i18n="mode_soc_d"></small></button>
    </div>
    <div id="expModeNote" hidden></div>
    <p id="expHint" style="color:var(--dim);font-size:12px;max-width:520px"></p>
    <label><input type="radio" name="expRange" value="all" checked> <span id="expAllLbl"></span></label>
    <label><input type="radio" name="expRange" value="seg"> <span data-i18n="exp_seg"></span></label>
    <details id="expCustom"><summary data-i18n="exp_custom"></summary>
      <div id="expMosaicOpts">
        <label><span data-i18n="exp_res"></span> <select id="expRes"><option value="1920" data-i18n="exp_res_hd" selected></option><option value="3840" data-i18n="exp_res_4k"></option></select></label>
        <label><input type="checkbox" id="expHud"> <span data-i18n="exp_hud"></span></label>
        <label><input type="checkbox" id="expPlace"> <span data-i18n="exp_place"></span></label>
      </div>
      <label><input type="checkbox" id="expBlur"> <span data-i18n="exp_blur"></span></label>
      <label><input type="checkbox" id="expSpeed"> <span data-i18n="exp_speed"></span></label>
      <label id="expGpsLbl"><input type="checkbox" id="expGps"> <span data-i18n="exp_gps"></span></label>
      <label><input type="checkbox" id="expPack"> <span data-i18n="exp_pack"></span></label>
      <label><input type="checkbox" id="expGeo"> <span data-i18n="exp_geo"></span></label>
    </details>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button id="expCancel" data-i18n="close"></button>
      <button id="expGo" class="primary" data-i18n="exp_go"></button>
    </div>
  </div>
  <div id="expRun" hidden style="min-width:420px">
    <progress id="expBar" max="1" value="0"></progress>
    <p id="expTxt" style="color:var(--dim);font-size:12px"></p>
    <div style="display:flex;justify-content:flex-end"><button id="expStop" data-i18n="exp_stop"></button></div>
  </div>
</dialog>
<script src="i18n.js"></script>
<script src="analysis.js"></script>
<script src="summary.js"></script>
<script src="../node_modules/mediabunny/dist/bundles/mediabunny.min.cjs"></script>
<script>
"use strict";
// Display order in grid mode mirrors the car's viewer: pillars/front on top, repeaters/back below.
const CAMS = [
  { id:"left_pillar",    key:"5" },
  { id:"front",          key:"1" },
  { id:"right_pillar",   key:"6" },
  { id:"left_repeater",  key:"3" },
  { id:"back",           key:"2" },
  { id:"right_repeater", key:"4" },
];
const TYPES = { SavedClips: 1, SentryClips: 1, RecentClips: 1 };   // the folders Tesla writes clips to
const typeName = type => t("type_" + type);
const reasonName = r => r ? (I18N[LANG]["r_" + r] ? t("r_" + r) : r.replace(/_/g, " ")) : "";
// Segment file name: 2026-04-17_15-08-49-front.mp4
const RX = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})-(front|back|left_repeater|right_repeater|left_pillar|right_pillar)\.mp4$/;
const $ = s => document.querySelector(s);

let events = [], filter = "all", cur = null, segIdx = -1, mainCam = "front";
let playing = false, rate = 1, loadToken = 0, seeking = false;
const vids = {};      // cam id -> <video>
const urls = {};      // cam id -> current object URL

// ---------- Stage ----------
const stage = $("#stage");
for (const c of CAMS) {
  const d = document.createElement("div");
  d.className = "cam"; d.dataset.cam = c.id;
  d.innerHTML = `<video muted playsinline preload="auto"></video><span class="lbl"><span data-i18n="cam_${c.id}"></span><kbd>${c.key}</kbd></span>`;
  d.onclick = () => { if (!stage.classList.contains("focus")) setLayout("focus", false); setMain(c.id); };
  d.ondblclick = () => toggleFullscreen();
  stage.appendChild(d);
  const v = d.querySelector("video");
  vids[c.id] = v;
  v.addEventListener("ended", () => { if (c.id === masterId()) nextSegment(); });
}

function masterId() {
  if (urls[mainCam]) return mainCam;
  for (const c of ["front", ...CAMS.map(x => x.id)]) if (urls[c]) return c;
  return mainCam;
}
function setMain(id) {
  mainCam = id;
  for (const el of stage.children) el.classList.toggle("main", el.dataset.cam === id);
  if (typeof refreshExportButton === "function") refreshExportButton();
  // In focus layout the main camera gets the big slot; keep the others in the strip in car order.
  let o = 1;
  for (const c of CAMS) stage.querySelector(`[data-cam="${c.id}"]`).style.order = stage.classList.contains("focus") ? (c.id === id ? 0 : o++) : "";
}
// The 3×2 grid is the car's own layout (an earlier "like in the car" view was the same thing
// and is mapped onto it).
const LAYOUTS = ["grid", "fb", "focus"];
let prefLayout = (() => { try { return localStorage.getItem("tcv.layout") || "grid"; } catch { return "grid"; } })();
if (!LAYOUTS.includes(prefLayout)) prefLayout = "grid";
function setLayout(l, remember = true) {
  stage.className = l;
  $("#layoutSel").value = l;
  if (remember) { prefLayout = l; try { localStorage.setItem("tcv.layout", l); } catch {} }
  if (l === "fb" && mainCam !== "back") mainCam = "front";
  setMain(mainCam);
  if (typeof refreshExportButton === "function") refreshExportButton();
}

// ---------- Telemetry HUD ----------
stage.insertAdjacentHTML("beforeend", `
  <div id="hud" hidden>
    <div class="gear"><span data-g="0">P</span><span data-g="2">R</span><span data-g="3">N</span><span data-g="1">D</span></div>
    <span id="hBlinkL" class="blink">◀</span>
    <div class="spd"><b id="hSpeed">0</b><small>km/h</small></div>
    <span id="hBlinkR" class="blink">▶</span>
    <svg id="hWheel" viewBox="-12 -12 24 24"><circle r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M-10 0H10M0 0V10" stroke="currentColor" stroke-width="2.2"/></svg>
    <span id="hSteer">0°</span>
    <div class="ped"><div class="bar"><i id="hAcc"></i></div><span data-i18n="accel"></span></div>
    <div class="gf" id="hGf" data-i18n-title="g_t"><b id="hG">0.00</b><small>g</small></div>
    <span id="hBrake" class="pill" data-i18n="brake"></span>
    <span id="hAp" class="pill">—</span>
  </div>
  <div id="hudNone" hidden data-i18n="hud_none"></div>`);
let hudOn = (() => { try { return localStorage.getItem("tcv.hud") !== "0"; } catch { return true; } })();
function setHud(on) {
  hudOn = on; $("#hudBtn").classList.toggle("on", on);
  try { localStorage.setItem("tcv.hud", on ? "1" : "0"); } catch {}
}
const apName = ap => (ap >= 1 && ap <= 3) ? t("ap" + ap) : null;
function telAt(arr, t) {
  let lo = 0, hi = arr.length - 1;
  if (hi < 0) return null;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (arr[m].t <= t) lo = m; else hi = m - 1; }
  return arr[lo];
}
function updateHud(seg, time) {   // not "t": that is the translation function
  const hud = $("#hud"), none = $("#hudNone");
  if (!hudOn || !seg) { hud.hidden = true; none.hidden = true; return; }
  const d = seg.tel ? telAt(seg.tel, time) : null;
  hud.hidden = !d;
  none.hidden = !!d || !Array.isArray(seg.tel);       // hide while still loading
  if (!d) return;
  $("#hSpeed").textContent = Math.round(Math.abs(d.speed) * 3.6);
  for (const g of hud.querySelectorAll(".gear span")) g.classList.toggle("on", +g.dataset.g === d.gear);
  $("#hWheel").style.transform = `rotate(${d.steer}deg)`;
  $("#hSteer").textContent = `${Math.round(d.steer)}°`;

    const folder = p.length >= 3 ? p[1] : null;            // event folder (Saved/Sentry); RecentClips is flat
    const key = (encrypted ? "E|" : "C|") + type + "|" + (folder || "");

  else if (e.key === "ArrowLeft" && cur) { e.preventDefault(); seekGlobal(g - (e.shiftKey ? 1 : 5)); }

  else if (e.key === "ArrowDown") { e.preventDefault(); stepEvent(1); }
  else if (cam) { if (!stage.classList.contains("focus")) setLayout("focus", false); setMain(cam.id); }
  else if (e.key === "g" || e.key === "G") setLayout(LAYOUTS[(LAYOUTS.indexOf(stage.className) + 1) % LAYOUTS.length]);
  else if (e.key === "Escape") setLayout(prefLayout, false);
  else if (e.key === "t" || e.key === "T") setHud(!hudOn);
  else if (e.key === "e" || e.key === "E") $("#toEvent").click();
  else if (e.key === "f" || e.key === "F") toggleFullscreen();
  else if (e.key === "+") setRate([0.25, 0.5, 1, 2, 4].find(r => r > rate) || 4);
  else if (e.key === "-") setRate([4, 2, 1, 0.5, 0.25].find(r => r < rate) || 0.25);
});
function toast(msg, ms = 4500) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  t.classList.toggle("link", typeof lastExport !== "undefined" && !!lastExport);
  clearTimeout(toast.h); toast.h = setTimeout(hideToast, ms);
}
function hideToast() { $("#toast").style.display = "none"; }
// ---------- Language ----------
let lastAuth = { connected: false };
function refreshTexts() {
  applyStaticText();
  for (const el of stage.querySelectorAll(".cam")) el.dataset.missing = t("no_image");
  $("#langSel").value = LANG;
  showAuth(lastAuth);
  if (events.length) { renderList(); updateStatus(); }
  if (cur) {
    const et = eventTime(cur);
    $("#info").textContent = [typeName(cur.type), cur.meta && cur.meta.street, cur.meta && cur.meta.city, cur.meta && reasonName(cur.meta.reason),
      et && t("info_event", { approx: et.approx ? "≈ " : "", time: fmtTime(et.d) })].filter(Boolean).join(" · ");
    updateMarker();
    renderMoments();
  }
  if (typeof refreshExportButton === "function") refreshExportButton();
  window.api.setLang(LANG);
}
$("#langSel").onchange = e => {
  LANG = e.target.value;
  try { localStorage.setItem("tcv.lang", LANG); } catch {}
  refreshTexts();
};

setLayout(prefLayout, false);
setHud(hudOn);
refreshTexts();
</script>
